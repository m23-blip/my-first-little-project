<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My First Photo Editor</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f4f5f8;
      color: #202339;
      font: 1rem/1.5 system-ui, sans-serif;
    }

    main {
      width: min(64rem, calc(100% - 2rem));
      margin: clamp(2rem, 7vw, 5rem) auto;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
      letter-spacing: -0.05em;
      line-height: 1.1;
    }

    .editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
    }

    @media (min-width: 48rem) {
      .editor { grid-template-columns: 16rem minmax(0, 1fr); }
    }

    .controls, .stage {
      background: white;
      border: 1px solid #dfe2eb;
      border-radius: 1.25rem;
      padding: clamp(1rem, 3vw, 1.5rem);
    }

    .controls {
      display: grid;
      align-self: start;
      gap: 1.25rem;
    }

    .control-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    label { font-weight: 650; }

    output {
      color: #525972;
      font-variant-numeric: tabular-nums;
    }

    input { accent-color: #5145b8; }

    input[type="range"], input[type="file"] {
      display: block;
      width: 100%;
      margin: 0.5rem 0 0;
    }

    input[type="file"]::file-selector-button {
      background: #eeebff;
      border: 0;
      border-radius: 0.5rem;
      color: #352886;
      padding: 0.5rem;
      cursor: pointer;
    }

    input[type="color"] {
      width: 3rem;
      height: 2rem;
      cursor: pointer;
    }

    .stage {
      display: grid;
      align-items: center;
      min-height: 22rem;
    }

    .preview {
      --spacing: 10px;
      --blur: 0px;
      --base: #7062d9;
      overflow: hidden;
      border: 4px solid var(--base);
      border-radius: 1rem;
      background: #eeedf5;
    }

    .preview-padding {
      padding: var(--spacing);
    }

    .photo {
      display: block;
      width: 100%;
      max-height: 65vh;
      object-fit: contain;
      filter: blur(var(--blur));
    }

    .placeholder {
      display: grid;
      place-items: center;
      min-height: 12rem;
      margin: 0;
      padding: 0.5rem;
      border-radius: 0.5rem;
      background: #e3dff8;
      color: #352886;
      text-align: center;
      overflow-wrap: anywhere;
      filter: blur(var(--blur));
    }

    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>My Photo Editor</h1>
    <div class="editor">
      <section class="controls" aria-label="Photo adjustments">
        <div>
          <label for="file">Open a photo</label>
          <input id="file" type="file" accept="image/*">
        </div>
        <div>
          <div class="control-heading">
            <label for="spacing">Spacing</label>
            <output id="spacing-value" for="spacing">10 px</output>
          </div>
          <input id="spacing" type="range" min="0" max="60" value="10">
        </div>
        <div>
          <div class="control-heading">
            <label for="blur">Blur</label>
            <output id="blur-value" for="blur">0 px</output>
          </div>
          <input id="blur" type="range" min="0" max="25" value="0">
        </div>
        <div class="control-heading">
          <label for="base">Border colour</label>
          <input id="base" type="color" value="#7062d9">
        </div>
      </section>

      <section class="stage" aria-label="Photo preview">
        <div class="preview">
          <div class="preview-padding">
            <p class="placeholder" role="status">Choose a photo to get started.</p>
            <img class="photo" alt="Selected photo" hidden>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const preview = document.querySelector('.preview');
    const spacing = document.querySelector('#spacing');
    const blur = document.querySelector('#blur');
    const borderColour = document.querySelector('#base');
    const fileInput = document.querySelector('#file');
    const photo = document.querySelector('.photo');
    const placeholder = document.querySelector('.placeholder');
    let photoUrl;

    function updatePreview() {
      // CSS reads these custom properties to update the preview.
      preview.style.setProperty('--spacing', spacing.value + 'px');
      preview.style.setProperty('--blur', blur.value + 'px');
      preview.style.setProperty('--base', borderColour.value);
      document.querySelector('#spacing-value').value = spacing.value + ' px';
      document.querySelector('#blur-value').value = blur.value + ' px';
    }

    spacing.addEventListener('input', updatePreview);
    blur.addEventListener('input', updatePreview);
    borderColour.addEventListener('input', updatePreview);
    updatePreview();

    photo.addEventListener('load', () => {
      photo.hidden = false;
      placeholder.hidden = true;
    });

    photo.addEventListener('error', () => {
      placeholder.textContent = 'This photo could not be opened. Choose another image.';
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      // A blob URL lets the browser display the local file without uploading it.
      if (photoUrl) URL.revokeObjectURL(photoUrl);
      photoUrl = URL.createObjectURL(file);
      photo.hidden = true;
      placeholder.hidden = false;
      placeholder.textContent = 'Opening photo…';
      photo.src = photoUrl;
    });
  </script>
</body>
</html>
